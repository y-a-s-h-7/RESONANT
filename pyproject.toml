[project]
name = "resonant"
version = "1.3.0"
description = "Resonant - hold-to-talk local dictation (STT + Ollama), Windows."
requires-python = ">=3.11,<3.15"   # supported range documented; do NOT upgrade the owner's Python

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]   # long prompt/log lines are intentional; readability over wrapping

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ollama: integration tests that need a reachable local Ollama (deselect with -m 'not ollama')",
]
